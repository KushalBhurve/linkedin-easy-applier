# Standard Screening Question Answers (Case-insensitive Regex / Substring Matchers)
screening_answers:
  # Legal & Authorization
  work_authorization: "Yes"             # Are you legally authorized to work in [Country]?
  sponsorship_required: "No"            # Will you now or in the future require visa sponsorship?
  over_18: "Yes"                        # Are you at least 18 years of age?
  background_check_consent: "Yes"       # Do you consent to a background check?
  drug_test_consent: "Yes"              # Do you consent to drug testing?

  # Logistics & Notice Period
  willing_to_relocate: "Yes"            # Are you willing to relocate?
  comfort_with_commute: "Yes"           # Are you able to commute to office / work hybrid?
  notice_period_days: 60               # Notice period in days (e.g. 0, 15, 30, 60, 90)
  notice_period_text: "60 Days"         # Text notice period (e.g., "Immediate", "30 Days")

  # Compensation (Adjust to your target preferences)
  current_ctc_lpa: "10"                  # Current CTC in LPA (e.g., 10)
  expected_ctc_lpa: "16"                # Expected CTC in LPA (e.g., 16)
  current_ctc_full: "1000000"           # Current CTC in full numeric digits (e.g. 1000000 for 10 LPA)
  expected_ctc_full: "1600000"          # Expected CTC in full numeric digits (e.g. 1600000 for 16 LPA)
  currency: "INR"

  # Standard Demographics / EEO (LinkedIn standard selects)
  gender: "Male"                        # "Male", "Female", "Decline to Self Identify"
  veteran_status: "No"                  # "I am not a protected veteran", "No", "Decline"
  disability_status: "No"               # "No, I do not have a disability", "Decline"

# Job Search Filter Settings
search:
  # Target roles to search on LinkedIn
  roles:
  # User's Original Roles
  # - "AI Engineer"
  # - "GenAI Engineer"
  # - "AI Developer"
  - "Python Developer"
  - "Backend Developer"
  - "SDE 1"
  - "Software Engineer"
  
  # Expanded AI & Data Roles
  - "Machine Learning Engineer"
  - "MLOps Engineer"
  - "LLM Engineer"
  - "NLP Engineer"
  - "Prompt Engineer"
  - "Data Engineer"
  
  # Expanded Cloud & Backend Roles
  - "Platform Engineer"
  - "Cloud Engineer"
  - "API Developer"
  - "Java Developer"
  - "Node.js Developer"
  
  # Expanded Full Stack & General Roles
  - "Full Stack Developer"
  - "Full Stack Engineer"
  - "Junior Software Engineer"
  - "Graduate Software Engineer"
  - "Software Development Engineer"

  # Target locations to search on LinkedIn: focuses on Bengaluru and Remote
  locations:
    - "Bengaluru"
    - "Remote"

  # Fallback location
  location: "Bengaluru"

  # Workplace types: 1 = On-site, 2 = Remote, 3 = Hybrid
  # [1, 2, 3] includes on-site and hybrid in Bangalore, and remote roles
  workplace_types: [1, 2, 3]

  # Date Posted filter: "past_24h", "past_week", "past_month", "any_time"
  date_posted: "past_week"

  # LinkedIn Experience Level Filter IDs:
  # 1 = Internship, 2 = Entry level, 3 = Associate, 4 = Mid-Senior, 5 = Director, 6 = Executive
  experience_levels: [2, 3]

  # Apply only to jobs with LinkedIn Easy Apply
  easy_apply_only: true

# Suitability Filter (Rejects non-suitable jobs BEFORE opening Easy Apply)
suitability_filter:
  max_years_required: 3                 # Reject if description states >= 4+ years required
  exclude_senior_titles: true
  senior_keywords:
    - "senior"
    - "sr."
    - "sr "
    - "lead"
    - "principal"
    - "architect"
    - "staff"
    - "director"
    - "manager"
    - "head of"
    - "vp"
    - "expert"
    - "specialist iii"
    - "engineer iii"

  company_blacklist:
    - "CyberCoders"
    - "Revature"
    - "Outlier"
    - "Tata Consultancy Services"
    - "TCS"
    - "Tata Consultancy"

  # Location filter: Restricts applications to Bangalore or Remote roles
  enforce_location: true
  allowed_locations:
    - "Bengaluru"
    - "Bangalore"
    - "Karnataka"
  allow_remote: true

# Execution Controls & Safety Settings
execution:
  # Dry-run mode: Navigates and fills out all form fields up to the final "Submit" screen,
  # logs answers, captures a screenshot, and safely discards without submitting.
  dry_run: false

  # Visible browser window so you can watch actions live and inspect interactions
  headless: false

  # Action delays (in seconds) to mimic human browsing behavior
  min_delay_sec: 2.0
  max_delay_sec: 5.0

  # Delay between consecutive job applications (seconds)
  delay_between_jobs_sec: 12.0

  # Max applications to process per session (LinkedIn safety limit recommended: <= 25/day)
  max_applications_per_run: 15

  # Save screenshots of completed forms in results/screenshots
  save_screenshots: true

# AI Screening Question Fallback (For unmapped or open-ended questions)
ai_fallback:
  enabled: true
  provider: "ollama"                    # "ollama" (free local) or "groq"
  
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2:latest"

  groq:
    api_key: ""
    model: "llama-3.3-70b-versatile"
